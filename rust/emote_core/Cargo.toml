# emote_core —— Emote 跨平台远程控制的核心库。
# 经 flutter_rust_bridge 2.x 与 Flutter(Dart) 双向通信；crate 由 rust-toolchain.toml 锁定 1.92.0。

[package]
name = "emote_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Emote cross-platform remote-control core library (Flutter + Rust FFI)."
license = "Apache-2.0"

# cdylib：为 Flutter 桌面端 / Android 提供动态库；staticlib：便于三方端打包/静态链接；
# rlib：供 `cargo test` 的集成测试（tests/ 目录）链接本 crate 公共 API（不影响 Flutter 消费的 cdylib）。
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "emote_core"

[dependencies]
# flutter_rust_bridge 2.x 运行时支持；版本与工具链清单锁定一致（frb_codegen 2.13.0）。
flutter_rust_bridge = "=2.13.0"

# ---- 第 2 段：设备发现 + 双传输层连接（最小可行框架）----
serde = { version = "1.0", features = ["derive"] }  # 统一消息/设备结构体序列化
uuid = { version = "1.12", features = ["v4", "serde"] } # 设备唯一 ID（UUID v4）
mdns-sd = "0.11"                                      # 第2.2段 mDNS 广播与发现
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
quinn = "0.11.11"                                     # 第2.3段默认传输层 QUIC
rcgen = "0.14"                                        # 第2.3段 QUIC 服务端自签证书（LAN 对等端）
bytes = "1.12.1"                                      # 第2.3段零拷贝 buffer / 统一消息头
anyhow = "1"                                          # 错误统一
futures = "0.3"                                       # QUIC async 并发
dashmap = "6"                                         # 连接管理器并发容器
tracing = "0.1"                                       # 诊断日志（轻量）
sha2 = "0.10"                                         # QUIC 证书指纹（SHA-256）严格校验

# ---- 第 3 段：核心功能 ----
scrcpy-protocol = "0.1.1"                             # 第3.1段 scrcpy 协议层（VideoPacket/ControlSender/h264）
libc = "0.2"                                           # uinput ioctl（纯 C 绑定，全 target 安全）

# 第 3 段可选特性：
# - `capture`：启用 pinray 真机屏幕捕获（默认关，保证沙箱/CI 默认构建不拉 pinray）。
[features]
default = []
capture = ["dep:pinray"]

# Windows 桌面（SendInput 注入 + openh264 软编解码 + 可选 pinray）
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
openh264 = "0.5"
pinray = { version = "0.2", optional = true }

# Linux 桌面（非 Android）：openh264 软编解码 + X11(XTest) 注入 + 可选 pinray
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
openh264 = "0.5"
x11-dl = "2"
pinray = { version = "0.2", optional = true }

# ---- 后续分段将以 feature 开关逐段启用 ----
# reis     = { version = "=0.7.0", features = ["tokio"] }   # Linux 输入注入（libei，按需）
# ffmpeg-next = { version = "=8.1.0", optional = true }     # 可选软件解码（第 4.3 段）

# 测试专用依赖：`#[tokio::test]` 需要 tokio 的 `test-util` 特性（不影响发布产物）。
[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# 发布优化配置：体积 / 性能 / 崩溃行为可控，满足可复现构建。
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true