name: Emote Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FRB_VERSION: '2.13.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: 安装 Rust（MSVC target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}

      - name: 生成 FFI 绑定
        run: flutter_rust_bridge_codegen generate
        working-directory: ./

      - name: Flutter 依赖
        run: flutter pub get
        working-directory: app

      - name: 编译 Rust 核心库
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: rust/emote_core

      - name: 构建 Windows 版本
        run: flutter build windows --release
        working-directory: app

      - name: 打包 Windows 为 ZIP（自包含：exe + dll + data/）
        shell: pwsh
        run: |
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" `
            -DestinationPath "app/build/windows/emote-windows-x86_64.zip" -Force
          # 校验包内容包含必需运行时文件
          Get-ChildItem "app/build/windows/x64/runner/Release/" -Recurse |
            Where-Object { $_.Name -in @('emote.exe','emote_core.dll','flutter_windows.dll','app.so','icudtl.dat') } |
            ForEach-Object { Write-Host "INCLUDED: $($_.FullName.Replace($PWD.Path,''))" }
          Get-Item "app/build/windows/emote-windows-x86_64.zip" | Select-Object Name,Length

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            app/build/windows/x64/runner/Release/
            app/build/windows/emote-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: 安装 Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: 安装 Rust（x86_64 GNU target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2

      - name: 安装 flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}

      - name: 生成 FFI 绑定
        run: flutter_rust_bridge_codegen generate
        working-directory: ./

      - name: Flutter 依赖
        run: flutter pub get
        working-directory: app

      - name: 编译 Rust 核心库
        run: cargo build --release --target x86_64-unknown-linux-gnu
        working-directory: rust/emote_core

      - name: 构建 Linux 版本
        run: flutter build linux --release
        working-directory: app

      - name: 安装 appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: 打包 AppImage + Linux 发布包
        run: |
          set -euo pipefail
          cd app
          mkdir -p packaging/AppDir/usr/bin packaging/AppDir/usr/share/applications
          cp -r build/linux/x64/release/bundle/* packaging/AppDir/usr/bin/

          cat > packaging/AppDir/usr/share/applications/emote.desktop <<'EOF'
          [Desktop Entry]
          Name=Emote
          Exec=emote
          Icon=emote
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF

          mkdir -p packaging/AppDir/usr/share/icons/hicolor/256x256/apps
          python3 - <<'EOF'
          import base64
          # 极简占位 PNG；后续可替换为项目真实图标
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          )
          open("packaging/AppDir/usr/share/icons/hicolor/256x256/apps/emote.png", "wb").write(png)
          EOF

          # 1) 可靠的发布包：直接打包 Flutter release bundle（保证可运行，解压后执行 ./emote）
          tar -C build/linux/x64/release/bundle -czf packaging/emote-linux-x86_64.tar.gz .
          ls -la packaging/emote-linux-x86_64.tar.gz

          # 2) AppImage（尽力而为）：gtk 插件改用 raw 源码脚本，避免已失效的 AppImage 资产(404)
          cd ..
          export PATH="$PWD:$PATH"
          set +e
          (
            set -euo pipefail
            export DEPLOY_GTK_VERSION=3
            export LDAI_OUTPUT="emote-linux-x86_64.AppImage"
            curl -fsSL -o linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
            chmod +x linuxdeploy-plugin-gtk.sh
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage
            ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --plugin gtk --appdir app/packaging/AppDir
            ./appimagetool-x86_64.AppImage --appimage-extract-and-run app/packaging/AppDir app/packaging/emote-linux-x86_64.AppImage
            ls -la app/packaging/emote-linux-x86_64.AppImage
          )
          APPIMAGE_RC=$?
          set -e
          if [ "$APPIMAGE_RC" -ne 0 ]; then
            echo "::warning::AppImage 打包未成功(rc=$APPIMAGE_RC)，已回退到 tar.gz 发布包"
          fi

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            app/packaging/emote-linux-x86_64.AppImage
            app/packaging/emote-linux-x86_64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 安装 Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: 安装 Rust（Android 交叉编译 targets）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2

      - name: 安装 flutter_rust_bridge_codegen 与 cargo-ndk
        run: |
          cargo install flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}
          cargo install cargo-ndk --locked

      - name: 生成 FFI 绑定
        run: flutter_rust_bridge_codegen generate
        working-directory: ./

      - name: Flutter 依赖
        run: flutter pub get
        working-directory: app

      - name: 编译 Rust 核心库（Android ABI）
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../../app/android/app/src/main/jniLibs build --release
        working-directory: rust/emote_core

      - name: 写入 Android 签名配置
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: 构建签名 APK
        run: flutter build apk --release
        working-directory: app

      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/app/outputs/flutter-apk/app-release.apk

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build-windows, build-linux, build-android]
    steps:
      - uses: actions/checkout@v5

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 汇总三端可运行产物（exe/dll/AppImage/apk/tar.gz/zip）
          mapfile -t FILES < <(find release-artifacts -type f \( \
            -name '*.exe' -o -name '*.dll' -o -name '*.AppImage' \
            -o -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' \) 2>/dev/null || true)
          echo "共 ${#FILES[@]} 个发布文件："
          printf '  %s\n' "${FILES[@]}"
          # 已存在 Release（重试/再次运行）时改为上传，避免 "already exists"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，上传文件到现有 Release"
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            echo "创建新 Release ${GITHUB_REF_NAME}"
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Emote ${GITHUB_REF_NAME}" \
              --notes "自动构建发布（Windows / Linux / Android）。Linux 提供 AppImage（尽力而为）与 tar.gz 发布包。"
          fi